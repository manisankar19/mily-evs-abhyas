<circle cx="40" cy="228" r="20"/><circle cx="70" cy="225" r="16"/><circle cx="330" cy="226" r="18"/><circle cx="360" cy="228" r="20"/>
</g>
<circle cx="40" cy="40" r="27" class="n"/><text x="40" y="50" class="t">2</text>
</g>

<!-- Panel 3: park with a see-saw and trees -->
<g transform="translate(10,320)">
<rect width="390" height="290" rx="10" fill="#dfeefa" class="o"/>
<rect x="2" y="200" width="386" height="88" fill="#8fd17c"/>
<rect x="290" y="120" width="22" height="110" fill="#8b5a2b" class="o"/>
<circle cx="301" cy="95" r="55" fill="#3f9b47" class="o"/>
