<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620">
<title>Four numbered scenes</title>
<style>
.o{stroke:#333;stroke-width:2;stroke-linejoin:round}
.n{fill:#fff;stroke:#333;stroke-width:3}
.t{font:bold 28px sans-serif;fill:#222;text-anchor:middle}
</style>
<rect width="820" height="620" fill="#fff"/>

<!-- Panel 1: house with a garden -->
<g transform="translate(10,10)">
<rect width="390" height="290" rx="10" fill="#dfeefa" class="o"/>
<ellipse cx="300" cy="60" rx="55" ry="22" fill="#fff"/>
