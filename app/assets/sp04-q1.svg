<circle cx="40" cy="40" r="27" class="n"/><text x="40" y="50" class="t">3</text>
</g>

<!-- Panel 4: houses and trees in a locality -->
<g transform="translate(420,320)">
<rect width="390" height="290" rx="10" fill="#dfeefa" class="o"/>
<rect x="2" y="225" width="386" height="63" fill="#8fd17c"/>
<path d="M2 255 L388 245 L388 270 L2 282 Z" fill="#b8b3a8" class="o"/>
