<text x="195" y="124" style="font:bold 18px sans-serif;fill:#fff;text-anchor:middle">SCHOOL</text>
<g fill="#bfe3f2" class="o">
<rect x="105" y="140" width="34" height="30"/><rect x="251" y="140" width="34" height="30"/>
<rect x="105" y="190" width="34" height="30"/><rect x="251" y="190" width="34" height="30"/>
<rect x="158" y="140" width="74" height="30"/>
</g>
<rect x="165" y="190" width="60" height="65" fill="#8a8fa0" class="o"/>
<g stroke="#333" stroke-width="2"><line x1="180" y1="190" x2="180" y2="255"/><line x1="195" y1="190" x2="195" y2="255"/><line x1="210" y1="190" x2="210" y2="255"/></g>
<rect x="20" y="238" width="140" height="22" fill="#c96f5e" class="o"/>
