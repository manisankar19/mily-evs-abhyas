<circle cx="40" cy="40" r="27" class="n"/><text x="40" y="50" class="t">1</text>
</g>

<!-- Panel 2: school building -->
<g transform="translate(420,10)">
<rect width="390" height="290" rx="10" fill="#dfeefa" class="o"/>
<ellipse cx="320" cy="55" rx="45" ry="20" fill="#fff"/>
