<rect x="120" y="135" width="160" height="95" fill="#f6e27a" class="o"/>
<polygon points="105,138 200,80 295,138" fill="#d9443a" class="o"/>
<rect x="150" y="165" width="42" height="65" fill="#4fa3a5" class="o"/>
<rect x="222" y="160" width="38" height="32" fill="#bfe3f2" class="o"/>
<line x1="241" y1="160" x2="241" y2="192" class="o"/>
<line x1="222" y1="176" x2="260" y2="176" class="o"/>
