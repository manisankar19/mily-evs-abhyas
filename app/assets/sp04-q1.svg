<rect x="55" y="170" width="12" height="60" fill="#8b5a2b" class="o"/>
<circle cx="61" cy="150" r="35" fill="#3f9b47" class="o"/>
<rect x="348" y="180" width="10" height="50" fill="#8b5a2b" class="o"/>
<circle cx="353" cy="162" r="28" fill="#3f9b47" class="o"/>
<circle cx="40" cy="40" r="27" class="n"/><text x="40" y="50" class="t">4</text>
</g>
</svg>
