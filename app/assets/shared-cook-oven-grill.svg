<path d="M-40 12 Q-44 -12 -20 -14 Q0 -14 4 2 Q2 16 -16 18 Q-36 20 -40 12 Z" fill="#c9773a"/>
<path d="M-32 0 L-26 -10 M-22 4 L-15 -10 M-12 8 L-5 -6" stroke="#6b3a1a" stroke-width="3.5"/>
</g>
</defs>
<rect width="400" height="300" fill="#ffffff"/>
