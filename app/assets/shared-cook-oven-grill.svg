<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<title>Cooking picture E</title>
<desc>A wide kitchen box with a glass door; pieces of chicken sit on a wire rack inside.</desc>
