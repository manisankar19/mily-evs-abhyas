<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 660" width="1260" height="660" font-family="Arial, Helvetica, sans-serif">
<title>Five numbered pictures</title>
<rect width="1260" height="660" fill="#ffffff"/>
<!-- Panel 1: a woman in a white coat with a stethoscope and a clipboard -->
<g transform="translate(20,20)">
  <rect width="400" height="300" rx="14" fill="#eef6fb" stroke="#9fb7c7" stroke-width="2"/>
  <rect x="0" y="250" width="400" height="50" fill="#d9e8f1"/>
  <!-- legs -->
  <rect x="172" y="236" width="20" height="44" fill="#3d4a66"/>
  <rect x="208" y="236" width="20" height="44" fill="#3d4a66"/>
  <ellipse cx="180" cy="282" rx="16" ry="7" fill="#222"/>
  <ellipse cx="220" cy="282" rx="16" ry="7" fill="#222"/>
  <!-- coat -->
  <path d="M150 128 Q200 112 250 128 L262 246 L138 246 Z" fill="#ffffff" stroke="#7a8a99" stroke-width="2.5"/>
  <path d="M186 124 L200 162 L214 124 Z" fill="#7fb3d5"/>
  <line x1="200" y1="162" x2="200" y2="246" stroke="#7a8a99" stroke-width="2"/>
  <rect x="216" y="176" width="26" height="22" fill="none" stroke="#7a8a99" stroke-width="2"/>
  <!-- red cross badge -->
  <rect x="160" y="150" width="20" height="20" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="167" y="153" width="6" height="14" fill="#c0392b"/>
  <rect x="163" y="157" width="14" height="6" fill="#c0392b"/>
  <!-- neck and head -->
  <rect x="191" y="108" width="18" height="18" fill="#e9b48a"/>
  <path d="M164 82 Q166 40 200 40 Q234 40 236 82 Q236 120 200 120 Q164 120 164 82 Z" fill="#4a2f1f"/>
  <circle cx="200" cy="84" r="28" fill="#f1c59a"/>
  <path d="M172 76 Q178 52 200 52 Q224 52 228 76 Q210 64 172 76 Z" fill="#4a2f1f"/>
  <circle cx="190" cy="86" r="3" fill="#222"/><circle cx="210" cy="86" r="3" fill="#222"/>
  <path d="M191 99 Q200 106 209 99" fill="none" stroke="#a5523a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- stethoscope -->
  <path d="M184 126 Q176 170 196 186 Q214 196 222 168 L216 126" fill="none" stroke="#3b3b3b" stroke-width="4"/>
  <circle cx="198" cy="190" r="9" fill="#9aa5ad" stroke="#3b3b3b" stroke-width="3"/>
  <path d="M150 134 Q132 180 142 228" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M150 134 Q132 180 142 228" fill="none" stroke="#7a8a99" stroke-width="2"/>
  <circle cx="143" cy="236" r="9" fill="#f1c59a"/>
  <!-- clipboard held in the left arm -->
  <path d="M250 132 Q276 170 258 214" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M250 132 Q276 170 258 214" fill="none" stroke="#7a8a99" stroke-width="2"/>
  <rect x="236" y="168" width="58" height="76" rx="4" fill="#a0703c" transform="rotate(-12 265 206)"/>
  <rect x="244" y="178" width="42" height="58" fill="#ffffff" transform="rotate(-12 265 206)"/>
  <g stroke="#9aa5ad" stroke-width="2" transform="rotate(-12 265 206)">
    <line x1="250" y1="192" x2="280" y2="192"/><line x1="250" y1="204" x2="280" y2="204"/><line x1="250" y1="216" x2="274" y2="216"/>
  </g>
  <circle cx="256" cy="214" r="9" fill="#f1c59a"/>
  <circle cx="26" cy="26" r="18" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <text x="26" y="33" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">1</text>
</g>
<!-- Panel 2: a woman pointing at a green board with a sum on it -->
<g transform="translate(430,20)">
  <rect width="400" height="300" rx="14" fill="#fbf4e8" stroke="#c8b48f" stroke-width="2"/>
  <rect x="40" y="40" width="210" height="140" rx="4" fill="#8a5a2b"/>
  <rect x="50" y="50" width="190" height="120" fill="#2f6b4f"/>
  <text x="110" y="122" font-size="40" fill="#f2f2f2" font-family="Comic Sans MS, cursive">2+3</text>
  <rect x="60" y="180" width="170" height="8" fill="#8a5a2b"/>
  <rect x="80" y="174" width="18" height="6" fill="#ffffff"/>
  <!-- woman -->
  <rect x="290" y="232" width="18" height="48" fill="#5a4a6b"/>
  <rect x="318" y="232" width="18" height="48" fill="#5a4a6b"/>
  <path d="M276 140 Q312 124 348 140 L356 240 L268 240 Z" fill="#e8743b"/>
  <!-- pointing arm to the board -->
  <path d="M282 150 L232 110" stroke="#e8743b" stroke-width="18" stroke-linecap="round"/>
  <circle cx="228" cy="106" r="9" fill="#f1c59a"/>
  <line x1="222" y1="100" x2="196" y2="84" stroke="#6b4a2b" stroke-width="4" stroke-linecap="round"/>
  <!-- other arm holding a book -->
  <path d="M344 150 Q360 190 334 206" stroke="#e8743b" stroke-width="18" fill="none" stroke-linecap="round"/>
  <rect x="306" y="190" width="40" height="30" fill="#c0392b" stroke="#7b241c" stroke-width="2"/>
  <rect x="302" y="120" width="18" height="20" fill="#f1c59a"/>
  <path d="M282 92 Q284 54 312 54 Q342 54 344 92 L346 150 Q330 130 312 132 Q292 130 280 150 Z" fill="#c98b3a"/>
  <circle cx="312" cy="96" r="26" fill="#f1c59a"/>
  <path d="M286 88 Q296 62 316 64 Q336 66 338 90 Q318 76 286 88 Z" fill="#c98b3a"/>
  <circle cx="303" cy="98" r="3" fill="#222"/><circle cx="321" cy="98" r="3" fill="#222"/>
  <path d="M304 110 Q312 116 320 110" fill="none" stroke="#a5523a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="18" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <text x="26" y="33" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">2</text>
</g>
<!-- Panel 3: a person in a red helmet and protective suit spraying water from a hose at flames -->
<g transform="translate(840,20)">
  <rect width="400" height="300" rx="14" fill="#fff3ea" stroke="#d4a98a" stroke-width="2"/>
  <!-- flames -->
  <path d="M300 280 Q270 230 300 200 Q296 230 318 214 Q312 170 346 150 Q340 190 362 200 Q376 176 372 160 Q400 210 380 280 Z" fill="#f39c12"/>
  <path d="M312 280 Q300 246 322 228 Q324 250 338 240 Q338 214 356 200 Q360 236 372 246 Q376 266 366 280 Z" fill="#e74c3c"/>
  <!-- water spray -->
  <g stroke="#3fa9f5" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M232 168 Q280 150 316 196"/><path d="M232 172 Q286 168 326 224"/><path d="M232 164 Q272 132 304 170"/>
  </g>
  <!-- legs and boots -->
  <rect x="122" y="226" width="26" height="46" fill="#4a3b1f"/>
  <rect x="160" y="226" width="26" height="46" fill="#4a3b1f"/>
  <rect x="116" y="268" width="36" height="14" rx="4" fill="#222"/><rect x="156" y="268" width="36" height="14" rx="4" fill="#222"/>
  <!-- suit -->
  <path d="M112 132 Q154 116 196 132 L204 236 L104 236 Z" fill="#c0392b"/>
  <rect x="108" y="196" width="94" height="10" fill="#f1c40f"/>
  <rect x="108" y="212" width="94" height="6" fill="#bdc3c7"/>
  <line x1="154" y1="132" x2="154" y2="236" stroke="#7b241c" stroke-width="3"/>
  <!-- hose held in both hands -->
  <path d="M60 280 Q70 220 130 196 Q170 180 214 170" fill="none" stroke="#555" stroke-width="12" stroke-linecap="round"/>
  <rect x="206" y="160" width="30" height="16" rx="3" fill="#8a8a8a" transform="rotate(-12 221 168)"/>
  <circle cx="150" cy="188" r="11" fill="#333"/><circle cx="196" cy="174" r="11" fill="#333"/>
  <!-- head with red helmet -->
  <circle cx="154" cy="98" r="26" fill="#f1c59a"/>
  <path d="M120 92 Q122 52 154 50 Q188 52 190 92 Z" fill="#d62c1a"/>
  <rect x="112" y="88" width="86" height="10" rx="5" fill="#a5281b"/>
  <path d="M146 58 L162 58 L166 80 L142 80 Z" fill="#f1c40f"/>
  <circle cx="145" cy="106" r="3" fill="#222"/><circle cx="163" cy="106" r="3" fill="#222"/>
  <path d="M146 116 Q154 121 162 116" fill="none" stroke="#a5523a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="18" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <text x="26" y="33" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">3</text>
</g>
<!-- Panel 4: children's play equipment: slide, swing and see-saw on grass -->
<g transform="translate(225,340)">
  <rect width="400" height="300" rx="14" fill="#e3f2fd" stroke="#90b4cf" stroke-width="2"/>
  <circle cx="350" cy="50" r="24" fill="#f9d44a"/>
  <path d="M0 220 L400 220 L400 286 Q400 300 386 300 L14 300 Q0 300 0 286 Z" fill="#7cc36b"/>
  <!-- tree -->
  <rect x="360" y="150" width="14" height="74" fill="#7a5230"/>
  <circle cx="367" cy="140" r="30" fill="#3f8f3a"/>
  <!-- slide with ladder and tower -->
  <rect x="40" y="96" width="70" height="12" fill="#e74c3c"/>
  <path d="M34 98 L75 62 L116 98 Z" fill="#f39c12"/>
  <line x1="46" y1="108" x2="46" y2="236" stroke="#2e86c1" stroke-width="7"/>
  <line x1="104" y1="108" x2="104" y2="236" stroke="#2e86c1" stroke-width="7"/>
  <g stroke="#2e86c1" stroke-width="5"><line x1="46" y1="134" x2="104" y2="134"/><line x1="46" y1="164" x2="104" y2="164"/><line x1="46" y1="194" x2="104" y2="194"/></g>
  <path d="M104 108 Q130 112 150 170 Q164 222 196 234 L196 246 Q154 236 140 176 Q124 124 104 124 Z" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <!-- swing -->
  <path d="M210 236 L236 92 L262 236" fill="none" stroke="#8e44ad" stroke-width="7" stroke-linejoin="round"/>
  <path d="M290 236 L316 92 L342 236" fill="none" stroke="#8e44ad" stroke-width="7" stroke-linejoin="round"/>
  <line x1="232" y1="94" x2="320" y2="94" stroke="#8e44ad" stroke-width="8"/>
  <line x1="262" y1="96" x2="262" y2="190" stroke="#555" stroke-width="3"/>
  <line x1="292" y1="96" x2="292" y2="190" stroke="#555" stroke-width="3"/>
  <rect x="254" y="188" width="46" height="9" rx="3" fill="#f1c40f"/>
  <!-- see-saw -->
  <path d="M150 284 L166 262 L182 284 Z" fill="#7f8c8d"/>
  <rect x="96" y="256" width="140" height="9" rx="4" fill="#e67e22" transform="rotate(-8 166 262)"/>
  <circle cx="26" cy="26" r="18" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <text x="26" y="33" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">4</text>
</g>
<!-- Panel 5: a tall cone-shaped hut made of hay and bamboo with a small doorway -->
<g transform="translate(635,340)">
  <rect width="400" height="300" rx="14" fill="#eaf4f8" stroke="#90b4cf" stroke-width="2"/>
  <path d="M0 240 L400 240 L400 286 Q400 300 386 300 L14 300 Q0 300 0 286 Z" fill="#b89b6a"/>
  <!-- trees behind -->
  <rect x="330" y="150" width="12" height="92" fill="#6d4c2e"/>
  <circle cx="336" cy="130" r="36" fill="#4f8f3c"/>
  <circle cx="60" cy="168" r="26" fill="#5c9e48"/><rect x="55" y="186" width="10" height="56" fill="#6d4c2e"/>
  <!-- bamboo tip -->
  <line x1="200" y1="18" x2="200" y2="52" stroke="#6b5a2b" stroke-width="5"/>
  <!-- hay cone -->
  <path d="M200 40 Q178 50 160 96 Q132 170 118 250 Q200 266 282 250 Q268 170 240 96 Q222 50 200 40 Z" fill="#c9a14a" stroke="#9c7a2f" stroke-width="2"/>
  <g stroke="#9c7a2f" stroke-width="2" fill="none" opacity="0.85">
    <path d="M200 46 L186 120 L170 200 L156 252"/><path d="M200 46 L214 120 L230 200 L244 252"/>
    <path d="M200 46 L198 140 L196 256"/><path d="M190 60 L160 160 L136 248"/><path d="M210 60 L240 160 L264 248"/>
    <path d="M152 120 Q200 132 248 120"/><path d="M138 180 Q200 196 262 180"/><path d="M128 226 Q200 242 272 226"/>
  </g>
  <g stroke="#e3c27a" stroke-width="2" fill="none">
    <path d="M176 90 L172 104"/><path d="M222 92 L228 108"/><path d="M160 150 L154 168"/><path d="M244 150 L250 168"/><path d="M184 210 L180 226"/><path d="M218 210 L222 226"/>
  </g>
  <!-- doorway -->
  <path d="M182 258 L182 214 Q200 200 218 214 L218 258 Z" fill="#3a2a1a"/>
  <circle cx="26" cy="26" r="18" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <text x="26" y="33" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">5</text>
</g>
</svg>
