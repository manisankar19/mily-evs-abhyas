        <rect x="350" y="78" width="8" height="45" fill="#7a5230"/><circle cx="354" cy="70" r="26" fill="#5aa35a"/>
        <circle cx="120" cy="88" r="22" fill="#6db36d"/><circle cx="300" cy="86" r="22" fill="#6db36d"/>
        <rect x="116" y="95" width="7" height="30" fill="#7a5230"/><rect x="296" y="93" width="7" height="30" fill="#7a5230"/>
      </g>
      <!-- elephants in the back enclosure -->
      <g fill="#8d939b" stroke="#4d535a" stroke-width="2">
        <ellipse cx="185" cy="102" rx="30" ry="18"/>
        <rect x="163" y="110" width="9" height="20"/><rect x="198" y="110" width="9" height="20"/>
        <circle cx="216" cy="96" r="13"/>
        <path d="M226,100 C234,110 232,124 226,128" fill="none" stroke-width="5"/>
        <ellipse cx="210" cy="96" rx="8" ry="11" fill="#7d838b"/>
        <ellipse cx="250" cy="108" rx="22" ry="13"/>
        <rect x="234" y="114" width="7" height="15"/><rect x="258" y="114" width="7" height="15"/>
        <circle cx="272" cy="104" r="10"/>
        <path d="M280,107 C286,115 284,124 280,127" fill="none" stroke-width="4"/>
