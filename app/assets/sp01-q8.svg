    <g stroke="#5c9a3a" stroke-width="2.5" fill="none">
      <path d="M40,272 L34,252 M46,272 L50,250 M60,272 L56,256 M300,272 L294,250 M308,272 L314,252 M330,272 L326,256 M350,272 L356,254 M90,272 L86,258 M100,272 L104,256"/>
    </g>
    <!-- bushy tail -->
    <path d="M240,250 C300,250 330,210 320,150 C312,100 270,60 228,70 C204,76 196,100 214,112 C238,96 268,104 278,140 C288,180 268,220 236,226 Z"
          fill="#a87b55" stroke="#5a3a20" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#7a5535" stroke-width="2" fill="none">
      <path d="M256,92 C280,110 296,140 296,170"/><path d="M300,200 C296,220 280,236 260,242"/>
    </g>
    <!-- body -->
    <path d="M150,262 C130,240 128,180 150,150 C168,128 210,128 226,156 C246,192 244,240 222,262 Z"
          fill="#b88a60" stroke="#5a3a20" stroke-width="3"/>
    <!-- back stripes -->
