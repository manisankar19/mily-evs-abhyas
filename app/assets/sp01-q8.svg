    <circle cx="40" cy="32" r="27" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
    <text x="40" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#222">1</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(400,10)">
    <rect x="8" y="0" width="384" height="300" rx="14" fill="#eef7fb" stroke="#9a8f7a" stroke-width="2"/>
    <!-- branch -->
