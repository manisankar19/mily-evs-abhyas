      <path d="M52,72 C40,110 70,150 112,162 L104,150 C76,140 56,112 64,80 Z"/>
      <path d="M348,72 C360,110 330,150 288,162 L296,150 C324,140 344,112 336,80 Z"/>
    </g>
    <g fill="#ffffff">
      <circle cx="62" cy="96" r="3"/><circle cx="68" cy="116" r="3"/><circle cx="80" cy="134" r="3"/><circle cx="96" cy="146" r="3"/>
      <circle cx="338" cy="96" r="3"/><circle cx="332" cy="116" r="3"/><circle cx="320" cy="134" r="3"/><circle cx="304" cy="146" r="3"/>
      <circle cx="112" cy="222" r="3"/><circle cx="124" cy="240" r="3"/><circle cx="288" cy="222" r="3"/><circle cx="276" cy="240" r="3"/>
    </g>
    <!-- body -->
    <ellipse cx="200" cy="100" rx="9" ry="10" fill="#222"/>
    <ellipse cx="200" cy="150" rx="8" ry="44" fill="#333" stroke="#111" stroke-width="2"/>
    <g stroke="#888" stroke-width="1.2"><path d="M193,140 H207 M193,152 H207 M193,164 H207 M194,176 H206"/></g>
    <circle cx="40" cy="32" r="27" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
    <text x="40" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#222">4</text>
  </g>

  <!-- Panel 5 -->
  <g transform="translate(600,330)">
    <rect x="8" y="0" width="384" height="300" rx="14" fill="#f2f8ec" stroke="#9a8f7a" stroke-width="2"/>
    <!-- grass -->
