      <path d="M206,110 C240,70 310,50 348,72 C360,110 330,150 288,162 C250,160 220,150 206,135 Z"/>
      <path d="M194,140 C160,160 110,172 100,210 C110,250 150,260 172,236 C188,220 194,190 196,160 Z"/>
      <path d="M206,140 C240,160 290,172 300,210 C290,250 250,260 228,236 C212,220 206,190 204,160 Z"/>
    </g>
    <!-- wing veins -->
    <g stroke="#222" stroke-width="2" fill="none">
      <path d="M190,118 L80,80 M188,126 L72,118 M186,134 L110,155"/>
      <path d="M210,118 L320,80 M212,126 L328,118 M214,134 L290,155"/>
      <path d="M192,160 L130,200 M194,175 L160,236"/>
      <path d="M208,160 L270,200 M206,175 L240,236"/>
    </g>
    <!-- white spots on dark edges -->
