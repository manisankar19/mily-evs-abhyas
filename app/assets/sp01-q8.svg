        <circle cx="200" cy="246" r="6" fill="#8a5a3a"/><rect x="194" y="252" width="12" height="20" rx="4" fill="#d24a4a"/>
        <circle cx="216" cy="250" r="5" fill="#8a5a3a"/><rect x="211" y="255" width="10" height="16" rx="3" fill="#3a6fc0"/>
      </g>
    </g>
    <rect x="8" y="0" width="384" height="300" rx="14" fill="none" stroke="#9a8f7a" stroke-width="2"/>
    <circle cx="40" cy="32" r="27" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
    <text x="40" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#222">3</text>
