          <path d="M318,196 L314,240 M330,196 L332,240 M352,196 L350,238 M364,194 L368,238" stroke="#c98a2a" stroke-width="4"/>
          <ellipse cx="342" cy="190" rx="30" ry="14" fill="#f0b843"/>
          <path d="M358,184 L374,128 L386,132 L370,190 Z" fill="#f0b843"/>
