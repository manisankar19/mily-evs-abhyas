      <g>
        <g fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5" transform="translate(-36,-92) scale(1.4)">
          <ellipse cx="70" cy="200" rx="22" ry="14"/>
          <path d="M84,192 C90,175 88,160 92,150" fill="none" stroke="#c9a28a" stroke-width="4"/>
          <circle cx="94" cy="148" r="5" fill="#c9a28a"/>
          <path d="M66,212 L62,240 M76,212 L80,240" stroke="#c9a28a" stroke-width="3.5"/>
          <ellipse cx="122" cy="206" rx="20" ry="13"/>
          <path d="M108,198 C102,182 104,168 100,158" fill="none" stroke="#c9a28a" stroke-width="4"/>
          <circle cx="98" cy="156" r="5" fill="#c9a28a"/>
          <path d="M118,217 L114,244 M128,217 L132,244" stroke="#c9a28a" stroke-width="3.5"/>
        </g>
        <path d="M14,250 C70,262 130,258 165,240" stroke="#6d5a40" stroke-width="3" fill="none"/>
        <path d="M14,232 C70,244 130,240 165,222" stroke="#6d5a40" stroke-width="3" fill="none"/>
        <g stroke="#6d5a40" stroke-width="2">
