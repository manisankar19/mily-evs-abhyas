<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img">
  <title>Question 8: five numbered pictures</title>
  <defs>
    <clipPath id="p3clip"><rect x="8" y="0" width="384" height="300" rx="14"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>

  <!-- Panel 1 -->
  <g transform="translate(0,10)">
    <rect x="8" y="0" width="384" height="300" rx="14" fill="#f4f1ea" stroke="#9a8f7a" stroke-width="2"/>
    <!-- leg -->
    <path d="M182,8 L222,8 L218,130 L186,130 Z" fill="#d9a92a" stroke="#5a4210" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#5a4210" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M184,25 L220,28"/><path d="M184,45 L220,48"/><path d="M185,65 L219,68"/><path d="M185,85 L219,88"/><path d="M186,105 L218,108"/>
    </g>
    <!-- toes: outline then fill -->
    <g stroke-linecap="round" fill="none">
      <g stroke="#5a4210" stroke-width="30">
        <path d="M202,128 C170,140 130,150 100,170"/>
        <path d="M202,128 C202,150 200,175 198,195"/>
        <path d="M202,128 C235,140 270,150 300,170"/>
        <path d="M206,124 C228,118 245,108 258,96"/>
      </g>
      <g stroke="#e8b92f" stroke-width="24">
        <path d="M202,128 C170,140 130,150 100,170"/>
        <path d="M202,128 C202,150 200,175 198,195"/>
        <path d="M202,128 C235,140 270,150 300,170"/>
        <path d="M206,124 C228,118 245,108 258,96"/>
      </g>
      <g stroke="#a07a18" stroke-width="1.5">
        <path d="M150,138 L156,160"/><path d="M128,148 L134,170"/><path d="M188,155 L214,155"/><path d="M188,175 L212,176"/>
        <path d="M250,138 L244,160"/><path d="M272,148 L266,170"/>
      </g>
    </g>
    <!-- long curved sharp talons -->
    <g fill="#1d1d1d">
      <path d="M92,162 C58,182 48,225 70,262 C68,228 80,198 108,178 Z"/>
      <path d="M188,190 C176,222 180,256 206,280 C196,252 196,224 210,196 Z"/>
      <path d="M308,162 C342,182 352,225 330,262 C332,228 320,198 292,178 Z"/>
      <path d="M262,90 C285,70 312,72 330,92 C306,86 288,92 268,104 Z"/>
