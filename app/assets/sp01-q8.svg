        <line x1="8" y1="140" x2="392" y2="140" stroke-width="3"/>
        <path d="M20,124 V144 M40,124 V144 M60,124 V144 M80,124 V144 M100,124 V144 M120,124 V144 M140,124 V144 M160,124 V144 M180,124 V144 M200,124 V144 M220,124 V144 M240,124 V144 M260,124 V144 M280,124 V144 M300,124 V144 M320,124 V144 M340,124 V144 M360,124 V144 M380,124 V144"/>
      </g>
