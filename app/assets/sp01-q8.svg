      <path d="M206,148 C222,170 230,200 228,236"/>
      <path d="M196,150 C212,175 218,205 216,240"/>
    </g>
    <ellipse cx="172" cy="218" rx="26" ry="36" fill="#efdcc0"/>
    <!-- head -->
    <ellipse cx="160" cy="118" rx="38" ry="32" fill="#b88a60" stroke="#5a3a20" stroke-width="3"/>
    <path d="M168,92 L176,66 L188,94 Z" fill="#b88a60" stroke="#5a3a20" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="148" cy="134" rx="20" ry="14" fill="#efdcc0"/>
    <circle cx="150" cy="110" r="7" fill="#111"/><circle cx="152" cy="108" r="2" fill="#ffffff"/>
    <ellipse cx="124" cy="124" rx="5" ry="4" fill="#3a2414"/>
    <g stroke="#3a2414" stroke-width="1.2"><path d="M128,126 L100,118 M128,128 L100,132"/></g>
    <!-- nut held in front paws -->
    <ellipse cx="146" cy="184" rx="14" ry="17" fill="#c58a3a" stroke="#6a4214" stroke-width="2.5"/>
    <path d="M130,176 C134,160 160,160 162,176 Z" fill="#7a5226" stroke="#4a2c10" stroke-width="2.5"/>
    <path d="M146,162 L148,154" stroke="#4a2c10" stroke-width="3"/>
    <g fill="#b88a60" stroke="#5a3a20" stroke-width="2.5">
      <ellipse cx="132" cy="190" rx="9" ry="7"/><ellipse cx="162" cy="190" rx="9" ry="7"/>
    </g>
    <!-- feet -->
    <g fill="#b88a60" stroke="#5a3a20" stroke-width="2.5">
      <ellipse cx="150" cy="266" rx="20" ry="7"/><ellipse cx="210" cy="266" rx="20" ry="7"/>
    </g>
    <circle cx="40" cy="32" r="27" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
    <text x="40" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#222">5</text>
  </g>
</svg>
