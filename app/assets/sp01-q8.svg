    <!-- tail -->
    <path d="M222,200 C250,240 270,268 300,292 L280,294 C250,272 226,246 206,212 Z" fill="#2f9d4a" stroke="#1d5f2c" stroke-width="2.5"/>
    <path d="M212,205 C228,245 240,268 252,294 L238,294 C224,266 210,240 198,212 Z" fill="#3a6fc0" stroke="#22427a" stroke-width="2.5"/>
    <!-- body -->
    <ellipse cx="200" cy="160" rx="55" ry="72" fill="#4cc25e" stroke="#1d5f2c" stroke-width="3"/>
    <!-- wing -->
    <path d="M205,110 C255,115 268,170 250,215 C232,205 205,175 200,130 Z" fill="#2f9d4a" stroke="#1d5f2c" stroke-width="2.5"/>
    <g stroke="#1d5f2c" stroke-width="1.5" fill="none"><path d="M222,160 C232,180 240,195 244,208"/><path d="M212,140 C222,165 230,185 236,205"/></g>
    <!-- head -->
    <circle cx="178" cy="82" r="44" fill="#4cc25e" stroke="#1d5f2c" stroke-width="3"/>
    <!-- neck ring -->
    <path d="M140,108 C160,128 196,130 218,112" stroke="#222" stroke-width="4" fill="none"/>
    <path d="M142,113 C162,133 196,135 216,118" stroke="#e8749a" stroke-width="3" fill="none"/>
    <!-- eye -->
    <circle cx="170" cy="70" r="10" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <circle cx="168" cy="70" r="5" fill="#111"/>
    <!-- hooked red beak -->
    <path d="M140,70 C112,66 98,84 102,106 C104,118 112,124 116,118 C114,102 122,94 140,96 Z" fill="#d6332e" stroke="#7a1712" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M140,96 C128,100 122,108 124,114 C132,114 140,108 146,100 Z" fill="#b02824" stroke="#7a1712" stroke-width="2"/>
    <!-- feet on branch -->
    <g stroke="#6b6b6b" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M182,226 L176,236"/><path d="M190,226 L192,238"/><path d="M212,224 L208,236"/><path d="M220,224 L224,236"/>
    </g>
    <circle cx="40" cy="32" r="27" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
    <text x="40" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#222">2</text>
  </g>

