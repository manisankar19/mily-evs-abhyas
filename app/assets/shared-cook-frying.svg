<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<title>Cooking picture C</title>
<desc>A flat pan with two patties in it, on a gas stove.</desc>
<defs>
<path id="fl" d="M0 0 C-9 -8 -8 -20 0 -32 C8 -20 9 -8 0 0 Z"/>
<path id="fs" d="M0 0 C-4 -4 -4 -10 0 -16 C4 -10 4 -4 0 0 Z"/>
</defs>
<rect width="400" height="300" fill="#ffffff"/>
<g stroke="#3b2a20" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- stove -->
<rect x="40" y="250" width="270" height="34" rx="8" fill="#6b5a4e"/>
<circle cx="80" cy="267" r="7" fill="#e8c48f"/>
<rect x="125" y="238" width="110" height="12" rx="4" fill="#3b3b3b"/>
<g fill="#f0913a"><use href="#fl" x="140" y="240"/><use href="#fl" x="165" y="240"/><use href="#fl" x="190" y="240"/><use href="#fl" x="215" y="240"/></g>
<g fill="#ffd34d" stroke-width="2"><use href="#fs" x="140" y="240"/><use href="#fs" x="165" y="240"/><use href="#fs" x="190" y="240"/><use href="#fs" x="215" y="240"/></g>
<!-- handle -->
<path d="M282 168 L372 148 Q382 146 384 156 Q386 166 376 168 L290 188 Z" fill="#5a4a40"/>
<!-- pan wall -->
<path d="M60 160 Q62 212 180 214 Q298 212 300 160 Z" fill="#5d6166"/>
<!-- pan rim -->
<ellipse cx="180" cy="160" rx="120" ry="40" fill="#8d9196"/>
<!-- oil -->
<ellipse cx="180" cy="162" rx="104" ry="31" fill="#f7c64a"/>
<g fill="none" stroke="#ffffff" stroke-width="3">
<path d="M104 152 Q118 140 138 137"/>
<path d="M240 178 Q252 174 262 166"/>
</g>
<!-- cutlets -->
<g fill="#c27a3a">
<ellipse cx="140" cy="163" rx="36" ry="19"/>
<ellipse cx="222" cy="160" rx="36" ry="19"/>
</g>
<g fill="none" stroke-width="2.5">
<path d="M112 158 Q140 146 168 158"/>
<path d="M194 155 Q222 143 250 155"/>
</g>
<g fill="#7a4a22" stroke="none">
<circle cx="126" cy="166" r="2.2"/><circle cx="140" cy="172" r="2.2"/><circle cx="154" cy="166" r="2.2"/><circle cx="132" cy="157" r="2"/><circle cx="150" cy="156" r="2"/>
<circle cx="208" cy="163" r="2.2"/><circle cx="222" cy="169" r="2.2"/><circle cx="236" cy="163" r="2.2"/><circle cx="214" cy="154" r="2"/><circle cx="232" cy="153" r="2"/>
</g>
<!-- bubbles of oil around cutlets -->
<g fill="#fff3c4" stroke-width="2">
<circle cx="100" cy="170" r="4"/><circle cx="182" cy="180" r="3.5"/><circle cx="263" cy="152" r="4"/><circle cx="180" cy="143" r="3"/>
</g>
<!-- oil splashes -->
<g fill="#f7c64a" stroke-width="2.5">
<circle cx="110" cy="110" r="5"/><circle cx="140" cy="95" r="4"/><circle cx="182" cy="104" r="5.5"/><circle cx="226" cy="92" r="4"/><circle cx="254" cy="112" r="5"/><circle cx="160" cy="76" r="3.5"/>
</g>
<g fill="none" stroke-width="2.5">
<path d="M124 128 L118 118"/><path d="M182 124 V114"/><path d="M240 128 L246 118"/>
</g>
</g>
</svg>
