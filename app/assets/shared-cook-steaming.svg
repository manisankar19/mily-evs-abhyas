<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<title>Cooking picture B</title>
<desc>A covered pot on a stove, drawn with its front cut open to show what is inside.</desc>
<defs>
<path id="fl" d="M0 0 C-9 -8 -8 -20 0 -32 C8 -20 9 -8 0 0 Z"/>
</defs>
<rect width="400" height="300" fill="#ffffff"/>
<g stroke="#3b2a20" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- stove -->
<rect x="90" y="262" width="220" height="22" rx="6" fill="#6b5a4e"/>
<g fill="#f0913a"><use href="#fl" x="150" y="262"/><use href="#fl" x="180" y="262"/><use href="#fl" x="210" y="262"/><use href="#fl" x="240" y="262"/></g>
<g fill="#ffd34d" stroke-width="2"><use href="#fl" x="150" y="262" transform="translate(75 131) scale(0.5)"/><use href="#fl" x="180" y="262" transform="translate(90 131) scale(0.5)"/><use href="#fl" x="210" y="262" transform="translate(105 131) scale(0.5)"/><use href="#fl" x="240" y="262" transform="translate(120 131) scale(0.5)"/></g>
<!-- pot body -->
<path d="M108 92 H292 V222 Q292 238 276 238 H124 Q108 238 108 222 Z" fill="#b9bcc0"/>
<path d="M108 120 H84 Q76 120 76 128 V136 Q76 144 84 144 H108" fill="#8d9196"/>
<path d="M292 120 H316 Q324 120 324 128 V136 Q324 144 316 144 H292" fill="#8d9196"/>
<!-- lid -->
<path d="M100 92 Q200 40 300 92 Z" fill="#cfd2d6"/>
<rect x="186" y="50" width="28" height="12" rx="5" fill="#8d9196"/>
<line x1="96" y1="92" x2="304" y2="92" stroke-width="5"/>
<!-- cut-away window (jagged edge) -->
<path d="M122 104 L140 100 L158 106 L178 99 L200 105 L222 99 L242 106 L262 100 L280 105 L282 128 L277 150 L283 176 L278 200 L282 226 L262 230 L240 225 L220 231 L198 225 L176 231 L154 225 L134 230 L120 226 L124 200 L118 176 L123 150 L118 128 Z" fill="#fdf6e8"/>
<!-- water at bottom -->
<path d="M121 205 Q136 199 150 205 T180 205 T210 205 T240 205 T270 205 L280 205 L281 226 L262 229 L240 224 L220 230 L198 224 L176 230 L154 224 L134 229 L121 226 Z" fill="#bfe0ef"/>
<g fill="#ffffff" stroke-width="2"><circle cx="150" cy="216" r="3"/><circle cx="205" cy="214" r="3"/><circle cx="252" cy="217" r="3"/></g>
<!-- central stand rod -->
<line x1="200" y1="112" x2="200" y2="205" stroke-width="4"/>
<!-- upper plate with idlis -->
<path d="M130 150 Q200 162 270 150 L270 157 Q200 169 130 157 Z" fill="#9a9ea4" stroke-width="2.5"/>
<g fill="#3b2a20" stroke="none"><circle cx="150" cy="156.5" r="2.3"/><circle cx="168" cy="158" r="2.3"/><circle cx="186" cy="159" r="2.3"/><circle cx="214" cy="159" r="2.3"/><circle cx="232" cy="158" r="2.3"/><circle cx="250" cy="156.5" r="2.3"/></g>
<g fill="#ffffff" transform="translate(0 -5)">
<path d="M140 154 Q140 136 159 136 Q178 136 178 156 Q159 160 140 154 Z"/>
<path d="M181 157 Q181 138 200 138 Q219 138 219 157 Q200 160 181 157 Z"/>
<path d="M222 156 Q222 136 241 136 Q260 136 260 154 Q241 160 222 156 Z"/>
</g>
<!-- lower plate with idlis -->
<path d="M130 190 Q200 202 270 190 L270 197 Q200 209 130 197 Z" fill="#9a9ea4" stroke-width="2.5"/>
<g fill="#3b2a20" stroke="none"><circle cx="150" cy="196.5" r="2.3"/><circle cx="168" cy="198" r="2.3"/><circle cx="186" cy="199" r="2.3"/><circle cx="214" cy="199" r="2.3"/><circle cx="232" cy="198" r="2.3"/><circle cx="250" cy="196.5" r="2.3"/></g>
<g fill="#ffffff" transform="translate(0 -5)">
<path d="M140 194 Q140 176 159 176 Q178 176 178 196 Q159 200 140 194 Z"/>
<path d="M181 197 Q181 178 200 178 Q219 178 219 197 Q200 200 181 197 Z"/>
<path d="M222 196 Q222 176 241 176 Q260 176 260 194 Q241 200 222 196 Z"/>
</g>
<!-- vapour arrows rising inside -->
<g fill="none" stroke="#8d9196" stroke-width="2" stroke-dasharray="3 4">
<path d="M128 200 Q124 160 130 116"/><path d="M272 200 Q276 160 270 116"/>
</g>
<!-- curls escaping from lid -->
<g fill="none" stroke-width="3.5">
<path d="M200 46 C188 38 212 30 200 20 C190 12 206 6 200 2"/>
<path d="M100 86 C80 76 96 60 80 50 C66 40 82 26 70 18"/>
<path d="M300 86 C320 76 304 60 320 50 C334 40 318 26 330 18"/>
<path d="M150 66 C140 54 158 46 148 34"/>
<path d="M250 66 C260 54 242 46 252 34"/>
</g>
</g>
</svg>
