<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="description" content="Chapter-wise EVS practice papers for Class 4 — The World Around Us.">
<title>EVS Practice · Class 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a5f'/%3E%3Cpath d='M32 50c-2-14 4-26 18-32-4 14-8 24-18 32zm0 0c-1-10-6-18-16-22 3 10 8 18 16 22z' fill='%237fd39a'/%3E%3C/svg%3E">
<!-- __INLINE_CSS__ -->
</head>
<body>
<!--
  Marking secret: the SHA-256 hash below is substituted at build time from the
  environment variable named in PROJECT-CARD.yml (marking_secret_env). The plain
  code never appears in this file. This is a deterrent for a nine-year-old, not a
  security boundary — see README.
-->
<script id="secret-hash" type="text/plain">__SECRET_HASH__</script>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-leaf" aria-hidden="true"></span>
      <span class="brand-text" data-ui="app.title"></span>
    </div>
    <div class="topbar-actions">
      <label class="theme-select">
        <span class="visually-hidden" data-ui="nav.theme"></span>
        <select id="theme-select" aria-label="Theme">
          <option value="system" data-ui="theme.system"></option>
          <option value="light" data-ui="theme.light"></option>
          <option value="dark" data-ui="theme.dark"></option>
        </select>
      </label>
      <button type="button" class="btn btn-ghost" id="logout-btn" data-ui="nav.logout"></button>
    </div>
  </div>
</header>

<main id="main">
  <!-- Login -->
  <section class="screen screen-login" id="screen-login">
    <form class="login-card" id="login-form" autocomplete="off" novalidate>
      <div class="login-art" aria-hidden="true"></div>
      <h1 data-ui="login.heading"></h1>
      <p class="muted" data-ui="login.sub"></p>
      <label class="field">
        <span data-ui="login.user"></span>
        <input type="text" id="login-user" name="user" autocapitalize="off" autocomplete="username" required>
      </label>
      <label class="field">
        <span data-ui="login.pass"></span>
        <input type="password" id="login-pass" name="pass" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" data-ui="login.submit"></button>
      <p class="tiny muted"><span data-ui="app.school"></span> · <span data-ui="app.year"></span></p>
    </form>
  </section>

  <!-- Chapter list -->
  <section class="screen screen-chapters" id="screen-chapters" hidden>
    <div class="container">
      <h1 id="chapters-greeting"></h1>
      <p class="muted" id="chapters-subtitle"></p>
      <div class="chapter-grid" id="chapter-grid"></div>
      <p class="tiny muted" data-ui="footer.note"></p>
    </div>
  </section>

  <!-- Paper -->
  <section class="screen screen-paper" id="screen-paper" hidden>
    <div class="paper-toolbar no-print">
      <div class="container toolbar-inner">
        <button type="button" class="btn btn-ghost" id="paper-back">← <span data-ui="paper.back"></span></button>
        <div class="toolbar-right">
          <button type="button" class="btn btn-ghost" id="paper-print" data-ui="paper.print"></button>
          <button type="button" class="btn btn-lock" id="mode-toggle"></button>
        </div>
      </div>
    </div>

    <div class="banner banner-practice no-print" id="practice-banner" data-ui="paper.practiceBanner"></div>
    <div class="banner banner-checking no-print" id="checking-banner" hidden data-ui="mode.checkingBanner"></div>

    <div class="container check-tools no-print" id="check-tools" hidden>
      <div class="scorebar" id="scorebar">
        <div class="score"><span class="score-label" data-ui="score.obtained"></span> <strong id="score-value"></strong></div>
        <div class="score"><span class="score-label" data-ui="score.checked"></span> <strong id="score-checked"></strong></div>
      </div>
      <div class="check-actions">
        <button type="button" class="btn btn-ghost" id="show-all-btn"></button>
        <button type="button" class="btn btn-ghost" id="clear-all-btn" data-ui="marks.clearAll"></button>
        <button type="button" class="btn btn-primary" id="result-btn" data-ui="result.button"></button>
      </div>
    </div>

    <article class="paper container" id="paper"></article>
  </section>

  <!-- Result -->
  <section class="screen screen-result" id="screen-result" hidden>
    <div class="container">
      <h1 data-ui="result.title"></h1>
      <p class="muted" id="result-paper-title"></p>
      <div class="result-summary" id="result-summary"></div>
      <p class="warn" id="result-warning" hidden></p>
      <div class="table-scroll">
        <table class="result-table" id="result-table"></table>
      </div>
      <div class="result-actions">
        <button type="button" class="btn btn-ghost" id="result-back" data-ui="result.back"></button>
        <button type="button" class="btn btn-primary" id="result-chapters" data-ui="result.chapters"></button>
      </div>
    </div>
  </section>
</main>

<dialog id="mode-dialog" class="dialog">
  <form method="dialog" id="mode-form">
    <h2 data-ui="mode.dialogTitle"></h2>
    <p class="muted" data-ui="mode.dialogSub"></p>
    <label class="field">
      <span data-ui="mode.codeLabel"></span>
      <input type="password" id="mode-code" autocomplete="off" inputmode="text">
    </label>
    <p class="form-error" id="mode-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="mode-cancel" data-ui="mode.cancel"></button>
      <button type="submit" class="btn btn-primary" id="mode-confirm" data-ui="mode.confirm"></button>
    </div>
  </form>
</dialog>

<!-- __INLINE_DATA__ -->
<!-- __INLINE_JS__ -->
</body>
</html>
